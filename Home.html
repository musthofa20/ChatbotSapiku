<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapiku - Asisten Peternakan Sapi 🐄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
        
        /* Typing animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-[#f0f9f0] font-sans h-screen flex flex-col p-4 md:p-8 selection:bg-green-300">

    <main class="max-w-3xl w-full mx-auto flex flex-col h-full bg-white rounded-2xl shadow-xl overflow-hidden border border-green-100">
        
        <!-- Header -->
        <header class="bg-[#2d6a4f] text-white p-5 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-full text-2xl shadow-inner">
                    🐄
                </div>
                <div>
                    <h1 class="font-bold text-xl">Sapiku</h1>
                    <p class="text-green-200 text-sm">Asisten Ahli Peternakan Sapi 🌾</p>
                </div>
            </div>
            <div class="text-3xl opacity-80">🚜</div>
        </header>

        <!-- Chat History Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-amber-50/30">
            <!-- Initial Greeting Message -->
            <div class="flex w-full mt-2 space-x-3 max-w-xs md:max-w-md">
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-green-600 flex items-center justify-center text-white text-lg">
                    🐄
                </div>
                <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm border border-green-100 text-gray-800 text-sm md:text-base leading-relaxed">
                    Halo! Saya adalah Sapiku, Asisten Peternakan Sapi Anda. Ada yang bisa saya bantu terkait peternakan sapi hari ini? 🌾
                </div>
            </div>
        </div>

        <!-- Typing Indicator (Hidden by default) -->
        <div id="typing-indicator" class="hidden p-4 bg-amber-50/30">
            <div class="flex w-full space-x-3 max-w-xs">
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-green-600 flex items-center justify-center text-white text-lg">
                    🐄
                </div>
                <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm border border-green-100 flex items-center gap-1">
                    <div class="w-2 h-2 bg-green-600 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-green-600 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-green-600 rounded-full typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <form id="chat-form" class="p-4 bg-white border-t border-green-100 flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                class="flex-1 border border-green-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all bg-gray-50"
                placeholder="Tanyakan tentang pakan, penyakit, atau perawatan sapi..."
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                id="send-button"
                class="bg-[#8b5a2b] hover:bg-[#6b4423] text-white font-medium py-3 px-6 rounded-xl transition-colors shadow-sm flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Kirim
            </button>
        </form>
    </main>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendButton = document.getElementById('send-button');

        // Store chat history for context
        let chatHistory = [];

        // System prompt to instruct the AI
        const systemPrompt = `Nama Anda adalah Sapiku, seorang ahli peternakan sapi (cow farming expert) yang berdedikasi. 
        Tugas Anda adalah menjawab pertanyaan pengguna seputar peternakan sapi dengan informatif, akurat, praktis, dan ramah. 
        Gunakan bahasa Indonesia yang baik dan benar. 
        Fokus pada topik seperti pakan, manajemen kandang, kesehatan sapi, pembibitan, dan bisnis peternakan. 
        Gunakan emoji bertema pertanian/sapi sesekali untuk membuat percakapan lebih menarik.`;

        // Add a message to the chat UI
        function appendMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex w-full mt-4 space-x-3 max-w-xs md:max-w-md ${role === 'user' ? 'ml-auto justify-end' : ''}`;

            const formattedText = text.replace(/\n/g, '<br>');

            if (role === 'user') {
                messageDiv.innerHTML = `
                    <div class="bg-[#8b5a2b] text-white p-3 rounded-l-lg rounded-br-lg shadow-sm text-sm md:text-base leading-relaxed break-words">
                        ${formattedText}
                    </div>
                    <div class="flex-shrink-0 h-10 w-10 rounded-full bg-amber-200 flex items-center justify-center text-amber-800 text-lg shadow-sm border border-amber-300">
                        🧑‍🌾
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="flex-shrink-0 h-10 w-10 rounded-full bg-green-600 flex items-center justify-center text-white text-lg shadow-sm">
                        🐄
                    </div>
                    <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm border border-green-100 text-gray-800 text-sm md:text-base leading-relaxed break-words">
                        ${formattedText}
                    </div>
                `;
            }

            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setTyping(isTyping) {
            if (isTyping) {
                typingIndicator.classList.remove('hidden');
                scrollToBottom();
                sendButton.disabled = true;
                userInput.disabled = true;
            } else {
                typingIndicator.classList.add('hidden');
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        async function fetchGeminiResponse(userText, retries = 3, delay = 1000) {
            const apiKey = ""; // API key will be injected by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            // Add user message to history only on the first attempt
            if (retries === 3) {
                chatHistory.push({ role: "user", parts: [{ text: userText }] });
            }

            const payload = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Implement exponential backoff for rate limits (429)
                if (response.status === 429 && retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchGeminiResponse(userText, retries - 1, delay * 2);
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const botResponse = candidate.content.parts[0].text;
                    // Add bot message to history
                    chatHistory.push({ role: "model", parts: [{ text: botResponse }] });
                    return botResponse;
                } else {
                    throw new Error("Invalid response format from API");
                }
            } catch (error) {
                // Retry on network errors
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchGeminiResponse(userText, retries - 1, delay * 2);
                }
                return "Maaf, terjadi kesalahan saat menghubungi server. Silakan periksa koneksi Anda dan coba lagi nanti. 😔";
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input and show user message
            userInput.value = '';
            appendMessage('user', text);
            setTyping(true);

            // Fetch and show bot response
            const responseText = await fetchGeminiResponse(text);
            
            setTyping(false);
            appendMessage('model', responseText);
        });
    </script>
</body>
</html>
